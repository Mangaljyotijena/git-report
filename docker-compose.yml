services:
  git-insights:
    build: .
    image: git-insights:latest
    container_name: git-insights
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3030}:3030"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3030                  # fixed inside the container; change HOST_PORT to remap
      TZ: ${TZ:-UTC}
    volumes:
      - git-insights-data:/data          # SQLite database, clones, encryption key
      - ${LOCAL_REPOS_DIR:-./repos}:/repos:ro   # optional: local repositories, add them as /repos/<name>

volumes:
  git-insights-data:
