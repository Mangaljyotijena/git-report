<script>
(function () {
  var toggles = [].slice.call(document.querySelectorAll('.theme-toggle'));
  function current() {
    var t = document.documentElement.dataset.theme;
    if (t) return t;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  toggles.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var next = current() === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem('gi-theme', next); } catch (e) { /* private mode */ }
    });
  });
})();
</script>
<script>
(function () {
  var side = document.getElementById('side');
  var scrim = document.getElementById('scrim');
  var menuBtn = document.getElementById('menu-btn');
  var closeBtn = document.getElementById('side-close');
  var moreBtn = document.getElementById('more-btn');
  var view = document.getElementById('view');
  var tabbar = document.querySelector('.tabbar');

  function setOpen(open, restoreFocus) {
    side.classList.toggle('open', open);
    scrim.hidden = !open;
    document.body.classList.toggle('nav-open', open);
    menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (view) view.inert = open;
    if (tabbar) tabbar.inert = open;
    if (open) {
      var first = side.querySelector('a[href]');
      if (first) first.focus();
    } else if (restoreFocus) {
      menuBtn.focus();
    }
  }
  menuBtn.addEventListener('click', function () { setOpen(!side.classList.contains('open'), true); });
  moreBtn.addEventListener('click', function () { setOpen(true, false); });
  closeBtn.addEventListener('click', function () { setOpen(false, true); });
  scrim.addEventListener('click', function () { setOpen(false, true); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && side.classList.contains('open')) setOpen(false, true);
  });
  side.addEventListener('click', function (e) { if (e.target.closest('a[href]')) setOpen(false, false); });
  window.addEventListener('hashchange', function () { setOpen(false, false); });
})();
</script>
